<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture diagram showing browser interface, Express server and routers, library modules, configuration and JSON data store, with numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#526277"/></marker>
  <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#147d72"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172334;font-size:14px}
    .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#536276}
    .head{font-size:15px;font-weight:700;fill:#26374b}.file{font-size:14px;font-weight:700}
    .small{font-size:12px;fill:#405168}.tiny{font-size:12px;fill:#526277}
    .box{fill:#fff;stroke:#aebdcd;stroke-width:1.4}.zone{fill:#f4f7fb;stroke:#d2dce7;stroke-width:1.2}
    .ticket{fill:#fff2d9;stroke:#d29227;stroke-width:2}.flow{fill:none;stroke:#147d72;stroke-width:2.2;marker-end:url(#flowArrow)}
    .dep{fill:none;stroke:#718197;stroke-width:1.4;marker-end:url(#arrow)}.dot{fill:#147d72;stroke:#fff;stroke-width:2}
    .number{font-size:12px;font-weight:700;fill:white;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="32" y="38" class="title">ShopLedger | application architecture</text>
<text x="32" y="60" class="sub">Browser POS · Express routes · business modules · JSON file persistence</text>

<!-- UI zone -->
<rect x="28" y="80" width="250" height="176" rx="10" class="zone"/>
<text x="44" y="105" class="head">Browser UI · public/</text>
<rect x="46" y="120" width="214" height="52" rx="7" class="box"/>
<text x="60" y="142" class="file">index.html · css/style.css</text><text x="60" y="160" class="small">POS, orders, Khata, audit views</text>
<rect x="46" y="184" width="214" height="54" rx="7" class="box"/>
<text x="60" y="206" class="file">js/app.js</text><text x="60" y="225" class="small">cart → POST /api/orders</text>

<!-- Server and routers -->
<rect x="302" y="80" width="868" height="176" rx="10" class="zone"/>
<text x="320" y="105" class="head">HTTP application</text>
<rect x="536" y="116" width="226" height="58" rx="8" class="box"/>
<text x="553" y="140" class="file">server.js · Express app</text><text x="553" y="160" class="small">static public/ · mounts /api</text>
<rect x="320" y="191" width="194" height="48" rx="7" class="box"/><text x="334" y="212" class="file">routes/products.js</text><text x="334" y="230" class="small">GET /products, /coupons</text>
<rect x="528" y="191" width="194" height="48" rx="7" class="box"/><text x="542" y="212" class="file">routes/orders.js</text><text x="542" y="230" class="small">POST /orders · order flow</text>
<rect x="736" y="191" width="194" height="48" rx="7" class="box"/><text x="750" y="212" class="file">routes/customers.js</text><text x="750" y="230" class="small">GET /customers · settle</text>
<rect x="944" y="191" width="208" height="48" rx="7" class="box"/><text x="958" y="212" class="file">routes/reports.js</text><text x="958" y="230" class="small">reports · preview · export</text>
<path d="M649 174 V184 H417 V191 M649 184 H625 V191 M649 184 H833 V191 M649 184 H1048 V191" class="dep"/>

<!-- Numbered flow, strip -->
<rect x="28" y="270" width="1142" height="74" rx="10" fill="#e8f5f2" stroke="#9bc9c1"/>
<text x="44" y="293" class="head">Order placement · numbered request path</text>
<g>
 <circle cx="58" cy="319" r="12" class="dot"/><text x="58" y="319" class="number">1</text><text x="78" y="324" class="small">app.js sends cart</text>
 <path d="M190 319 H255" class="flow"/>
 <circle cx="276" cy="319" r="12" class="dot"/><text x="276" y="319" class="number">2</text><text x="296" y="324" class="small">server.js routes request</text>
 <path d="M460 319 H510" class="flow"/>
 <circle cx="531" cy="319" r="12" class="dot"/><text x="531" y="319" class="number">3</text><text x="551" y="324" class="small">orders.js validates + orchestrates</text>
 <path d="M789 319 H840" class="flow"/>
 <circle cx="861" cy="319" r="12" class="dot"/><text x="861" y="319" class="number">4</text><text x="881" y="324" class="small">pricing / stock / Khata</text>
 <path d="M1020 319 H1050" class="flow"/>
 <circle cx="1070" cy="319" r="12" class="dot"/><text x="1070" y="319" class="number">5</text><text x="1090" y="324" class="small">write db</text>
</g>

<!-- Libraries -->
<rect x="28" y="359" width="1142" height="314" rx="10" class="zone"/>
<text x="46" y="384" class="head">Business and persistence modules · lib/</text>
<rect x="46" y="402" width="212" height="58" rx="7" class="box"/><text x="60" y="426" class="file">lib/pricing.js</text><text x="60" y="446" class="small">subtotal · computeTotals</text>
<rect x="46" y="476" width="212" height="58" rx="7" class="ticket"/><text x="60" y="500" class="file">lib/tax.js</text><text x="60" y="520" class="small">getRateForItem · HSN slabs</text>
<rect x="46" y="550" width="212" height="58" rx="7" class="box"/><text x="60" y="574" class="file">lib/coupons.js</text><text x="60" y="594" class="small">validate · calculateDiscount</text>

<rect x="286" y="402" width="212" height="58" rx="7" class="box"/><text x="300" y="426" class="file">lib/inventory.js</text><text x="300" y="446" class="small">find · check · reserve</text>
<rect x="286" y="476" width="212" height="58" rx="7" class="box"/><text x="300" y="500" class="file">lib/orders.js</text><text x="300" y="520" class="small">add · get · cancel · list</text>
<rect x="286" y="550" width="212" height="58" rx="7" class="box"/><text x="300" y="574" class="file">lib/ledger.js</text><text x="300" y="594" class="small">Khata debit · settlement</text>

<rect x="526" y="402" width="212" height="58" rx="7" class="box"/><text x="540" y="426" class="file">lib/store.js</text><text x="540" y="446" class="small">read · write · appendAudit</text>
<rect x="526" y="476" width="212" height="58" rx="7" class="box"/><text x="540" y="500" class="file">lib/reports.js</text><text x="540" y="520" class="small">dashboard · GST reconciliation</text>
<rect x="526" y="550" width="212" height="58" rx="7" class="box"/><text x="540" y="574" class="file">lib/dates.js</text><text x="540" y="594" class="small">today · normalizeDateKey</text>

<rect x="766" y="402" width="236" height="58" rx="7" class="ticket"/><text x="780" y="426" class="file">lib/invoice.js</text><text x="780" y="446" class="small">computeInvoiceFigures · render</text>
<rect x="766" y="476" width="236" height="58" rx="7" class="box"/><text x="780" y="500" class="file">config.js</text><text x="780" y="520" class="small">shop · tax · coupon settings</text>
<rect x="766" y="550" width="236" height="58" rx="7" class="box"/><text x="780" y="574" class="file">data/db.json</text><text x="780" y="594" class="small">products · orders · customers</text>

<rect x="1022" y="402" width="130" height="112" rx="7" fill="#fff" stroke="#aebdcd"/><text x="1034" y="426" class="file">Key calls</text><text x="1034" y="450" class="small">POST /orders →</text><text x="1034" y="470" class="small">orders.add(db,…)</text><text x="1034" y="490" class="small">store.write(db)</text>
<rect x="1022" y="532" width="130" height="76" rx="7" class="ticket"/><text x="1034" y="556" class="small">Ticket focus</text><text x="1034" y="578" class="small">invoice math</text><text x="1034" y="596" class="small">+ GST slabs</text>

<!-- Dependencies and flow lines -->
<path d="M625 239 V365 H152 V402" class="flow"/>
<path d="M625 239 V368 H392 V402" class="flow"/>
<path d="M625 239 V371 H632 V402" class="dep"/>
<path d="M625 239 V374 H884 V402" class="dep"/>
<path d="M258 431 H274 V490 H258" class="dep"/>
<path d="M152 460 V476" class="dep"/>
<path d="M258 505 H270 V579 H258" class="dep"/>
<path d="M498 505 H516 V431 H526" class="dep"/>
<path d="M498 579 H516 V431" class="dep"/>
<path d="M738 505 H754 V431 H766" class="dep"/>
<path d="M738 431 H754 V505 H766" class="dep"/>
<path d="M884 460 V476" class="dep"/>
<path d="M884 534 V550" class="dep"/>
<path d="M1002 431 H1015 V460 H1022" class="dep"/>
<path d="M1002 579 H1015 V490 H1022" class="dep"/>

<!-- Legend and footer -->
<rect x="28" y="690" width="1142" height="78" rx="10" fill="#fbfcfe" stroke="#d2dce7"/>
<text x="46" y="718" class="head">Legend</text>
<rect x="115" y="703" width="22" height="18" rx="3" class="ticket"/><text x="146" y="718" class="small">Ticket focus: invoice and GST slab calculation</text>
<path d="M430 712 H478" class="flow"/><text x="490" y="718" class="small">Numbered order path / request flow</text>
<path d="M750 712 H798" class="dep"/><text x="810" y="718" class="small">Module use / data dependency</text>
<text x="46" y="748" class="tiny">Solid numbered steps follow POST /api/orders; invoice rendering is a separate GET /orders/:id/invoice path in server.js.</text>
</svg>
